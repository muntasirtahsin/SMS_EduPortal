name: Publish EduPortal release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eduportal-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Choose next patch version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          $latest = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          if ($latest.tag_name -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Latest release tag must use vMAJOR.MINOR.PATCH format."
          }
          $version = "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $version"

      - name: Download dependencies
        shell: pwsh
        run: ./download_deps.ps1

      - name: Test release-feed parsing
        shell: pwsh
        run: |
          $testClasses = Join-Path $env:RUNNER_TEMP "eduportal-tests"
          New-Item -ItemType Directory -Force -Path $testClasses | Out-Null
          $classpath = Join-Path $PWD "lib\*"
          javac --release 17 -encoding UTF-8 -cp $classpath -d $testClasses `
            src/com/eduportal/utils/AutoUpdater.java `
            test/com/eduportal/utils/AutoUpdaterFeedTest.java
          if ($LASTEXITCODE -ne 0) {
            throw "Release-feed regression tests failed to compile."
          }
          java -cp "$testClasses;$classpath" com.eduportal.utils.AutoUpdaterFeedTest
          if ($LASTEXITCODE -ne 0) {
            throw "Release-feed regression tests failed."
          }

      - name: Build update package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./prepare-launch4j.ps1 -Version $env:RELEASE_VERSION

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: EduPortal ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/EduPortal/EduPortal-update.zip
